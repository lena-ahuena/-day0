<head>

<style>
:root{color-scheme:dark;--bg:#111321;--panel:#1c2033;--line:#343a50;--ink:#f5f1e9;--muted:#b8bed1;--gold:#efcc83;--green:#a5e1ba;--red:#ffb4ae;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29263f 0,var(--bg) 50%);color:var(--ink);line-height:1.5}main{max-width:1100px;margin:auto;padding:24px 18px 90px}h1,h2,h3,p{margin:0}h1{font-size:clamp(30px,5vw,52px);letter-spacing:-.055em;line-height:1.1}h2{font-size:21px;letter-spacing:-.025em}small,.muted{color:var(--muted)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:#242a40;border-radius:10px;padding:10px 13px;min-height:44px}button:hover{border-color:var(--gold)}button.primary{background:var(--gold);color:#252039;border-color:var(--gold);font-weight:700}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}button.danger{color:var(--red)}input,select,textarea{background:#121625;border:1px solid #4b536e;border-radius:9px;padding:10px;min-width:0;width:100%}input[type=checkbox]{width:auto;accent-color:var(--gold)}textarea{resize:vertical;min-height:85px}label{display:grid;gap:5px;font-size:14px;font-weight:600}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px}.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:18px}.avatar{width:79px;height:79px;background:#322e47;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:39px}.xpbar{height:10px;background:#111321;border-radius:99px;overflow:hidden;margin:9px 0}.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#a790ea,#efcc83);border-radius:99px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}.stack{display:grid;gap:14px;align-content:start}.tabs{display:flex;gap:7px;overflow-x:auto;margin:18px 0;scrollbar-width:thin}.tabs button{white-space:nowrap}.tabs button.active{background:#3c3552;color:var(--gold);border-color:#8573ae}.date{flex:1;max-width:175px}.task{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:44px 1fr;gap:10px}.task:first-child{border-top:0}.check{border-radius:50%;width:44px;height:44px;padding:0;font-size:19px}.task.done .check{background:var(--green);color:#10271b}.task.done h3{text-decoration:line-through;color:var(--muted)}.task h3{font-size:16px;overflow-wrap:anywhere}.task small{font-size:13px}.tag{font-size:13px;color:var(--gold)}.task-actions{margin-top:8px}.task-actions button{font-size:13px;padding:5px 9px;min-height:34px}.section-title{margin:14px 0 5px;color:var(--gold);font-size:14px;font-weight:700}.skills{display:grid;gap:10px;margin-top:10px}.skill{padding:10px;background:#15192a;border-radius:10px}.skill .xpbar{height:6px;margin:6px 0}.achievement{padding:10px 0;border-bottom:1px solid var(--line)}.achievement:last-child{border:0}.locked{opacity:.55}.ritual{display:grid;gap:8px;margin-top:10px}.ritual label{display:flex;align-items:center;padding:5px 0;font-weight:400}.ritual input{width:21px;height:21px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.calendar button{min-height:40px;padding:4px;position:relative;font-size:14px}.calendar button.selected{border-color:var(--gold);color:var(--gold)}.calendar button.marked:after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:100%;background:var(--green);left:calc(50% - 2px)}.calendar span{text-align:center;font-size:12px;color:var(--muted)}.empty{color:var(--muted);padding:15px 0}.modal{border:1px solid #626985;background:#202438;color:var(--ink);border-radius:18px;padding:18px;width:min(550px,94vw);max-height:90dvh;overflow:auto}.modal::backdrop{background:#050712cc}form{display:grid;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{font-size:14px;color:var(--muted)}.toast{position:fixed;bottom:18px;right:18px;max-width:90vw;background:#efcc83;color:#252039;border-radius:12px;padding:13px 18px;box-shadow:0 5px 25px #0005;z-index:20}.mini{font-size:13px}.sublist{margin-top:7px;display:grid;gap:5px}.sublist label{display:flex;align-items:center;font-weight:400}.sublist input{width:18px;height:18px}.badge{display:inline-block;padding:3px 9px;border-radius:20px;background:#332e46;color:var(--gold);font-size:13px}.wrap{overflow-wrap:anywhere}.hide,[hidden]{display:none!important}@media(max-width:700px){.layout{grid-template-columns:1fr}.hero{gap:12px}.avatar{width:65px;height:65px;font-size:30px}main{padding:20px 12px 70px}.panel{padding:13px}.task-actions{gap:5px}.task-actions button{min-height:40px}.two{grid-template-columns:1fr 1fr}.tabs{margin:14px 0}}
</style>
</head><body><main>
<header class="hero"><div class="avatar" aria-label="Персонаж">✦</div><div><small>ТВОЯ REAL LIFE RPG</small><h1>Мой мир</h1><div class="row between"><strong id="level"></strong><span id="xp"></span></div><div class="xpbar"><i id="progress"></i></div><small id="levelHint"></small></div></header>
<nav class="tabs" aria-label="Разделы"><button data-tab="today" class="active">День</button><button data-tab="tree">Навыки</button><button data-tab="ach">Ачивки</button><button data-tab="items">Инвентарь</button><button data-tab="journal">История</button><button data-tab="archive">Архив</button><button data-tab="settings">Настройки</button></nav>
<div id="view"></div>
</main>
<dialog class="modal" id="editor"><form id="taskForm"><div class="row between"><h2 id="formTitle">Новый квест</h2><button type="button" id="closeEditor">✕</button></div>
<label>Название<input id="title" maxlength="180" required></label><div class="two"><label>Дата<input type="date" id="taskDate" required></label><label>Время<input type="time" id="taskTime"></label></div>
<label>Направления (можно несколько)<div id="skillChecks" class="sublist"></div></label>
<div class="two"><label>XP<input id="taskXP" type="number" min="0" max="5000" required></label><label>Повторение<select id="repeat"><option value="none">Разово</option><option value="daily">Каждый день</option><option value="weekly">Каждую неделю</option></select></label></div>
<label class="row"><input type="checkbox" id="mainQuest"> Главный квест дня</label><label>Подзадачи, по одной в строке<textarea id="subtasks"></textarea></label>
<label>Заметка или результат<textarea id="taskNote"></textarea></label>
<p class="note">Подзадачи делят опыт квеста между собой. Суммарная награда не превышает указанное XP.</p><button class="primary" type="submit">Сохранить</button></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const skills=[['business','💰','Бизнес и продажи',['Консалтинг и экономика','Партнёрки','Своя витрина']],['tech','💻','Сайты и технологии',['Tilda и Taplink','HTML / CSS','Доработки и резервные копии']],['data','📊','Данные и аналитика',['Google Sheets и отчёты','B2B-базы','Исследования и качество данных']],['auto','⚙️','Автоматизация и ИИ',['Боты и CRM','Apps Script','Поддержка и мониторинг']],['local','🍕','Еда и локальные проекты',['AMIGO DELIVERY','Онлайн-заказы','Агрегатор Балаклавы']],['magic','🔮','Мистика',['ИИ-гадалка','Денежная карта','Scorpio']],['art','🎨','Творчество',['Открытки и ретроплакаты','Саундтреки мест','Фото и рисунок']],['people','🤝','Люди и события',['Арт-пикник','Сообщества','Совместные проекты']],['body','🏃','Движение',['Бег','Прогулки и походы','Разминка']],['study','📚','Учёба и эксперименты',['Новые инструменты','Игровые механики','Исследования']],['rest','🌙','Режим и восстановление',['Утро','Вечер','Подготовка следующего дня']]];
const suggestions={business:'Отправить одно предложение потенциальному клиенту',tech:'Доработать один блок сайта',data:'Собрать пример отчёта из двух файлов',auto:'Найти одну повторяющуюся операцию для автоматизации',local:'Проверить путь заказа в доставке',magic:'Написать одну фразу для гадалки',art:'Сохранить один сюжет для открытки',people:'Продумать одно действие для сообщества',body:'Выбрать комфортную прогулку или разминку',study:'15 минут практики на реальной задаче',rest:'Подготовить место для завтрашней работы'};
const rituals={morning:{title:'Утренний ритуал',xp:15,steps:['Оценить состояние','Выбрать главный квест','Размяться или немного подвигаться']},evening:{title:'Вечерний ритуал',xp:15,steps:['Отметить сделанное','Записать итог дня','Подготовиться ко сну']},tomorrow:{title:'Подготовка завтра',xp:15,steps:['Выбрать первое действие','Проверить встречи и время','Подготовить всё необходимое']}};
const KEY='my-world-rpg-v1';
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const dateKey=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
function addDays(key,n){const d=new Date(key+'T12:00:00');d.setDate(d.getDate()+n);return dateKey(d)}
function dayDiff(a,b){return Math.round((Date.parse(a+'T12:00:00Z')-Date.parse(b+'T12:00:00Z'))/86400000)}
const fresh=()=>({version:1,tasks:[],series:[],generated:{},days:{},items:[]});
const makeTask=(title,date,time,skillIds,xp,extra={})=>({id:uid(),title,date,time,skills:skillIds,xp,subs:[],note:'',main:false,done:false,archived:false,seriesId:null,...extra});
let state;let storageError=false;
try{const raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):fresh();if(!raw){state.tasks.push(makeTask('Подготовиться к встрече','2026-11-26','10:15',['local','business'],10),makeTask('Встреча с владельцем доставки','2026-11-26','10:30',['local','people','business'],30,{main:true}),makeTask('Доделать сайт доставки','2026-11-26','',['tech','local'],50));localStorage.setItem(KEY,JSON.stringify(state));}}catch(e){state=fresh();storageError=true}
let date=dateKey(),tab='today',editing=null,toastTimer;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageError=true;toast('Не удалось сохранить. Скачай резервную копию в настройках.')} }
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function getDay(key){return state.days[key]??(state.days[key]={checks:{},mood:'',note:'',first:'',minimal:false})}
function earned(t){if(t.done)return t.xp;return t.subs.length?Math.floor(t.xp*t.subs.filter(s=>s.done).length/t.subs.length):0}
function ritualEarned(d){return Object.entries(rituals).reduce((total,[k,r])=>total+(r.steps.every((_,i)=>d.checks[k+':'+i])?r.xp:0),0)}
function totalXP(){return state.tasks.reduce((sum,t)=>sum+earned(t),0)+Object.values(state.days).reduce((sum,d)=>sum+ritualEarned(d),0)}
function materialize(key){for(const s of state.series){const difference=dayDiff(key,s.start);if(!s.active||difference<0||(s.repeat==='weekly'&&difference%7!==0))continue;const marker=s.id+'|'+key;if(state.generated[marker])continue;state.generated[marker]=true;state.tasks.push(makeTask(s.title,key,s.time,[...s.skills],s.xp,{seriesId:s.id,main:!!s.main,subs:s.subs.map(text=>({text,done:false})),note:s.note}));}save()}
function skillXP(id){let n=0;for(const t of state.tasks){const pos=t.skills.indexOf(id);if(pos>=0){const x=earned(t);n+=Math.floor(x/t.skills.length)+(pos<x%t.skills.length?1:0)}}if(id==='rest')n+=Object.values(state.days).reduce((s,d)=>s+ritualEarned(d),0);return n}
function stats(){const xp=totalXP();$('level').textContent='Уровень '+(Math.floor(xp/100)+1);$('xp').textContent=xp+' XP';$('progress').style.width=xp%100+'%';$('levelHint').textContent=(100-xp%100)+' XP до следующего уровня'}
function achievementList(){const done=state.tasks.filter(t=>t.done),activeDays=new Set([...state.tasks.filter(t=>earned(t)>0).map(t=>t.date),...Object.entries(state.days).filter(([_,d])=>ritualEarned(d)>0).map(([k])=>k)]);return [['Первый шаг','Завершить один квест',done.length>=1],['А сегодня что для завтра сделал я?','Завершить подготовку завтра',Object.values(state.days).some(d=>rituals.tomorrow.steps.every((_,i)=>d.checks['tomorrow:'+i]))],['Алхимик','Завершить квест в нескольких направлениях',done.some(t=>t.skills.length>1)],['Изобретатель','Завершить квест автоматизации',done.some(t=>t.skills.includes('auto'))],['Коллекционер','Добавить первый результат в инвентарь',state.items.length>0],['Три дня в деле','Получить опыт в три разные даты',activeDays.size>=3],['Многогранность','Прокачать пять навыков',skills.filter(s=>skillXP(s[0])>0).length>=5],['Усрусь, но разберусь','Набрать 500 XP',totalXP()>=500]]}
function skillNames(ids){return ids.map(id=>skills.find(s=>s[0]===id)?.[2]||id).join(' · ')}
function taskHTML(t,archived=false){const subs=t.subs.map((s,i)=>'<label><input type="checkbox" data-sub="'+i+'" data-id="'+esc(t.id)+'" '+(s.done?'checked':'')+'> '+esc(s.text)+'</label>').join('');return '<div class="task '+(t.done?'done':'')+'"><button class="check" data-action="toggle" data-id="'+esc(t.id)+'" aria-label="'+(t.done?'Отменить выполнение':'Выполнить')+'" '+(archived?'disabled':'')+'>'+(t.done?'✓':'○')+'</button><div><div class="row between"><small>'+esc(t.time||'Без времени')+' · '+esc(skillNames(t.skills))+'</small><span class="tag">'+earned(t)+' / '+t.xp+' XP</span></div><h3>'+(t.main?'★ ':'')+esc(t.title)+'</h3>'+(t.note?'<p class="note wrap">'+esc(t.note)+'</p>':'')+(subs&&!archived?'<div class="sublist">'+subs+'</div>':'')+'<div class="row task-actions">'+(archived?'<button data-action="restore" data-id="'+esc(t.id)+'">Восстановить</button>':'<button data-action="edit" data-id="'+esc(t.id)+'">Изменить</button><button data-action="archive" data-id="'+esc(t.id)+'">В архив</button>')+'<button class="danger" data-action="delete" data-id="'+esc(t.id)+'">Удалить</button></div></div></div>'}
function ritualHTML(key,d){const r=rituals[key];return '<div class="ritual"><div class="row between"><strong>'+r.title+'</strong><span class="tag">+'+r.xp+' XP</span></div>'+r.steps.map((s,i)=>'<label><input type="checkbox" data-ritual="'+key+':'+i+'" '+(d.checks[key+':'+i]?'checked':'')+'> '+s+'</label>').join('')+'</div>'}
function calendarHTML(){const first=date.slice(0,7)+'-01';const start=addDays(first,-((new Date(first+'T12:00:00').getDay()+6)%7));return '<div class="calendar">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<span>'+x+'</span>').join('')+Array.from({length:42},(_,i)=>{const k=addDays(start,i);const mark=state.tasks.some(t=>t.date===k&&!t.archived)||state.days[k];return '<button data-date="'+k+'" class="'+(k===date?'selected ':'')+(mark?'marked':'')+'" style="opacity:'+(k.slice(0,7)===date.slice(0,7)?1:.45)+'" aria-label="'+k+'">'+Number(k.slice(-2))+'</button>'}).join('')+'</div>'}
function dayHTML(){materialize(date);const d=getDay(date);const tasks=state.tasks.filter(t=>t.date===date&&!t.archived).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));const completed=tasks.filter(t=>t.done).length;const dayXP=state.tasks.filter(t=>t.date===date).reduce((a,t)=>a+earned(t),0)+ritualEarned(d);
return '<div class="layout"><div class="stack"><section class="panel"><div class="row between"><h2>Квесты дня</h2><span class="badge">'+dayXP+' XP сегодня</span></div><div class="row" style="margin:12px 0"><button data-nav="-1" aria-label="Предыдущий день">‹</button><input class="date" type="date" id="currentDate" value="'+date+'"><button data-nav="1" aria-label="Следующий день">›</button><button data-action="today">Сегодня</button><button data-date="'+addDays(dateKey(),1)+'">Завтра</button><button class="primary" data-action="add">+ Квест</button></div><div class="row between"><small>'+completed+' из '+tasks.length+' выполнено</small><button data-action="minimal">'+(d.minimal?'Обычный режим':'Лёгкий день')+'</button></div>'+(d.minimal?'<p class="note" style="margin:12px 0">Выбери одно короткое дело. Можно перенести остальное без штрафа.</p><button data-action="tiny">+ 5 минут на идею (10 XP)</button>':'')+'<div style="margin-top:12px">'+(tasks.map(t=>taskHTML(t)).join('')||'<p class="empty">Свободный день. Выбери маленький шаг или добавь встречу.</p>')+'</div></section><section class="panel"><h2>Дневник</h2><label style="margin-top:10px">Как себя чувствую?<select id="mood"><option value="">Выбрать</option>'+['Бодро','Нормально','Устала','Нужен отдых'].map(m=>'<option '+(d.mood===m?'selected':'')+'>'+m+'</option>').join('')+'</select></label><label style="margin-top:10px">Что получилось сегодня?<textarea id="dayNote">'+esc(d.note)+'</textarea></label><label style="margin-top:10px">Первое действие завтра<textarea id="firstTomorrow">'+esc(d.first)+'</textarea></label><button data-action="tomorrowTask" style="margin-top:10px">Добавить действие в завтрашние квесты</button></section></div><div class="stack"><section class="panel"><h2>Календарь · '+new Date(date+'T12:00:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</h2>'+calendarHTML()+'</section><section class="panel"><h2>Ритуалы</h2>'+ritualHTML('morning',d)+ritualHTML('evening',d)+ritualHTML('tomorrow',d)+'</section></div></div>'}
function render(){stats();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';
if(tab==='today')html=dayHTML();
if(tab==='tree')html='<div class="panel"><h2>Дерево навыков</h2><p class="note">Каждые 100 XP — уровень ветки. Опыт многопрофильного квеста распределяется между навыками.</p><div class="skills">'+skills.map(([id,icon,name,topics])=>{const n=skillXP(id);return '<div class="skill"><div class="row between"><strong>'+icon+' '+name+'</strong><span>'+n+' XP · ур. '+(Math.floor(n/100)+1)+'</span></div><div class="xpbar"><i style="width:'+n%100+'%"></i></div><small>'+topics.join(' · ')+'</small><div class="row" style="margin-top:8px"><button data-action="skillTask" data-skill="'+id+'">+ Квест в эту ветку</button></div></div>'}).join('')+'</div></div>';
if(tab==='ach')html='<div class="panel"><h2>Достижения</h2>'+achievementList().map(([name,desc,yes])=>'<div class="achievement '+(yes?'':'locked')+'"><strong>'+(yes?'🏆':'🔒')+' '+name+'</strong><p class="note">'+desc+'</p></div>').join('')+'</div>';
if(tab==='items')html='<div class="panel"><h2>Инвентарь результатов</h2><form id="itemForm" style="margin:14px 0"><label>Название работы<input id="itemTitle" required maxlength="180"></label><label>Ссылка или заметка<textarea id="itemNote"></textarea></label><button class="primary">Добавить результат</button></form>'+state.items.map(i=>'<div class="achievement"><strong>'+esc(i.title)+'</strong><p class="note wrap">'+esc(i.note)+'</p><small>'+esc(i.date)+'</small> <button data-action="itemDelete" data-id="'+esc(i.id)+'">Удалить</button></div>').join('')+'</div>';
if(tab==='journal')html='<div class="panel"><h2>История</h2>'+[...new Set([...Object.keys(state.days),...state.tasks.map(t=>t.date)])].sort().reverse().map(k=>{const d=state.days[k];const tasks=state.tasks.filter(t=>t.date===k&&earned(t)>0);return '<div class="achievement"><strong>'+k+' · '+(tasks.reduce((n,t)=>n+earned(t),0)+(d?ritualEarned(d):0))+' XP</strong>'+tasks.map(t=>'<p class="note wrap">✓ '+esc(t.title)+' · '+earned(t)+' XP</p>').join('')+(d?.note?'<p class="wrap">'+esc(d.note)+'</p>':'')+'<button data-date="'+k+'">Открыть день</button></div>'}).join('')+'</div>';
if(tab==='archive')html='<div class="panel"><h2>Архив квестов</h2>'+ (state.tasks.filter(t=>t.archived).map(t=>taskHTML(t,true)).join('')||'<p class="empty">Пока пусто.</p>')+'<h2 style="margin-top:20px">Повторяющиеся квесты</h2>'+state.series.map(s=>'<div class="achievement"><strong>'+esc(s.title)+'</strong><p class="note">'+(s.repeat==='daily'?'Ежедневно':'Еженедельно')+' · '+(s.active?'Активно':'Остановлено')+'</p><button data-action="seriesToggle" data-id="'+esc(s.id)+'">'+(s.active?'Остановить повторение':'Возобновить')+'</button></div>').join('')+'</div>';
if(tab==='settings')html='<div class="panel stack"><h2>Настройки и сохранение</h2><p>Прогресс хранится в браузере устройства. Перенос на другое устройство — через резервную копию JSON.</p><button data-action="export">Скачать резервную копию</button><label>Восстановить из копии<input type="file" id="importFile" accept=".json,application/json"></label><button class="danger" data-action="reset">Сбросить все данные</button><p class="note">На iPhone при размещении по HTTPS открой игру в Safari и добавь на экран «Домой». После первой полной загрузки PWA доступна офлайн.</p></div>';
$('view').innerHTML=html;if(storageError)$('view').insertAdjacentHTML('afterbegin','<p class="note" style="color:var(--red)">Хранилище браузера недоступно. Экспортируй резервную копию перед закрытием.</p>');bind();stats()}
function openEditor(task,skill){editing=task?.id||null;const t=task||makeTask(skill?suggestions[skill]:'',date,'',skill?[skill]:['business'],20);$('formTitle').textContent=editing?'Изменить квест':'Новый квест';$('title').value=t.title;$('taskDate').value=t.date;$('taskTime').value=t.time;$('taskXP').value=t.xp;$('taskNote').value=t.note;$('mainQuest').checked=!!t.main;$('subtasks').value=t.subs.map(s=>s.text).join('\n');$('repeat').value='none';$('repeat').disabled=!!editing;$('skillChecks').innerHTML=skills.map(([id,icon,name])=>'<label><input type="checkbox" value="'+id+'" '+(t.skills.includes(id)?'checked':'')+'> '+icon+' '+name+'</label>').join('');$('editor').showModal()}
$('closeEditor').onclick=()=>$('editor').close();
$('taskForm').onsubmit=e=>{e.preventDefault();const ids=[...$('skillChecks').querySelectorAll('input:checked')].map(el=>el.value);if(!ids.length){toast('Выбери хотя бы одно направление');return}const old=state.tasks.find(t=>t.id===editing);const subs=$('subtasks').value.split('\n').map(x=>x.trim()).filter(Boolean).map(text=>({text,done:old?.subs.find(s=>s.text===text)?.done||false}));const t=makeTask($('title').value.trim(),$('taskDate').value,$('taskTime').value,ids,Number($('taskXP').value),{subs,note:$('taskNote').value,main:$('mainQuest').checked,done:old?.done||false});if(!t.title)return;if(old){Object.assign(old,t,{id:old.id,archived:old.archived,seriesId:old.seriesId});if(old.done)old.subs.forEach(s=>s.done=true);else if(old.subs.length&&old.subs.every(s=>s.done))old.done=true;}else{const repeat=$('repeat').value;if(repeat!=='none'){const id=uid();state.series.push({id,active:true,repeat,start:t.date,title:t.title,time:t.time,skills:t.skills,xp:t.xp,main:t.main,subs:t.subs.map(s=>s.text),note:t.note});t.seriesId=id;state.generated[id+'|'+t.date]=true}state.tasks.push(t)}date=t.date;tab='today';save();$('editor').close();render()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
function bind(){const view=$('view');view.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.date){date=b.dataset.date;tab='today';render();return}if(b.dataset.nav){date=addDays(date,Number(b.dataset.nav));render();return}const t=state.tasks.find(t=>t.id===b.dataset.id);const before=totalXP();switch(b.dataset.action){case 'add':openEditor();return;case 'edit':openEditor(t);return;case 'skillTask':openEditor(null,b.dataset.skill);return;case 'today':date=dateKey();break;case 'toggle':t.done=!t.done;t.subs.forEach(s=>s.done=t.done);break;case 'archive':t.archived=true;break;case 'restore':t.archived=false;break;case 'delete':if(!confirm('Удалить квест и весь его XP?'))return;state.tasks=state.tasks.filter(x=>x.id!==t.id);break;case 'minimal':getDay(date).minimal=!getDay(date).minimal;break;case 'tiny':state.tasks.push(makeTask('5 минут на любую идею',date,'',['study'],10));break;case 'tomorrowTask':{const title=getDay(date).first.trim();if(!title){toast('Запиши первое действие на завтра');return}const next=addDays(date,1);if(!state.tasks.some(t=>t.date===next&&t.title===title))state.tasks.push(makeTask(title,next,'',['business'],20));toast('Квест на завтра готов');break}case 'seriesToggle':{const s=state.series.find(s=>s.id===b.dataset.id);s.active=!s.active;break}case 'itemDelete':if(!confirm('Удалить результат?'))return;state.items=state.items.filter(i=>i.id!==b.dataset.id);break;case 'export':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='my-world-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}case 'reset':if(!confirm('Стереть все квесты, XP и историю? Сначала можно скачать копию.'))return;state=fresh();break;default:return}save();render();const diff=totalXP()-before;if(diff>0)toast('+'+diff+' XP!');else if(diff<0)toast('Опыт пересчитан ('+diff+' XP)')};
view.onchange=async e=>{const el=e.target;if(el.id==='currentDate'){if(el.value){date=el.value;render()}return}if(el.id==='mood'){getDay(date).mood=el.value;save();return}if(el.id==='importFile'){if(!el.files[0])return;try{const copy=JSON.parse(await el.files[0].text());if(!valid(copy))throw Error('Некорректная копия');if(confirm('Заменить текущий прогресс из файла?')){state=copy;save();render();toast('Копия восстановлена')}}catch(err){toast('Не удалось импортировать: '+err.message)}return}const before=totalXP();if(el.dataset.ritual){getDay(date).checks[el.dataset.ritual]=el.checked}else if(el.dataset.sub!==undefined){const t=state.tasks.find(t=>t.id===el.dataset.id);t.subs[Number(el.dataset.sub)].done=el.checked;t.done=t.subs.every(s=>s.done)}else return;save();render();const diff=totalXP()-before;if(diff>0)toast('+'+diff+' XP!')};
view.oninput=e=>{if(e.target.id==='dayNote'){getDay(date).note=e.target.value;save()}if(e.target.id==='firstTomorrow'){getDay(date).first=e.target.value;save()}};
const itemForm=$('itemForm');if(itemForm)itemForm.onsubmit=e=>{e.preventDefault();const title=$('itemTitle').value.trim();if(!title)return;state.items.push({id:uid(),title,note:$('itemNote').value,date:dateKey()});save();render();toast('Результат в инвентаре!')} }
function valid(s){return s&&s.version===1&&Array.isArray(s.tasks)&&Array.isArray(s.series)&&Array.isArray(s.items)&&s.generated&&s.days&&s.tasks.every(t=>/^[a-zA-Z0-9_-]+$/.test(t.id)&&typeof t.title==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&Number.isFinite(t.xp)&&t.xp>=0&&Array.isArray(t.skills)&&t.skills.length>0&&Array.isArray(t.subs)&&t.subs.every(x=>typeof x.text==='string'&&typeof x.done==='boolean'))&&Object.keys(s.days).every(k=>/^\d{4}-\d{2}-\d{2}$/.test(k))&&Object.values(s.days).every(d=>d&&d.checks)&&s.series.every(x=>/^[a-zA-Z0-9_-]+$/.test(x.id)&&Array.isArray(x.skills)&&Array.isArray(x.subs))&&s.items.every(i=>/^[a-zA-Z0-9_-]+$/.test(i.id)&&typeof i.title==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(i.date))}
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
